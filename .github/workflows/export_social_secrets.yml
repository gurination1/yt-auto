name: Export Social Secrets
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle Social Secrets
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USERNAME: ${{ secrets.DM_USERNAME }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
          RUMBLE_CHANNEL_ID: ${{ secrets.RUMBLE_CHANNEL_ID }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          BEACONS_LINK: ${{ secrets.BEACONS_LINK }}
        run: |
          python3 - <<'PYEOF'
          import os, json, base64
          
          keys = [
              "FB_PAGE_ID", "FB_PAGE_TOKEN", "IG_USER_ID",
              "DM_API_KEY", "DM_API_SECRET", "DM_USERNAME", "DM_PASSWORD",
              "RUMBLE_EMAIL", "RUMBLE_PASSWORD", "RUMBLE_CHANNEL_ID",
              "COVERR_API_KEY", "FREESOUND_API_KEY", "BEACONS_LINK"
          ]
          data = {k: os.environ.get(k, "") for k in keys}
          encoded = base64.b64encode(json.dumps(data).encode()).decode()
          with open("social_secrets.enc", "w") as f:
              f.write(encoded)
          PYEOF
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-secrets
          path: social_secrets.enc
          retention-days: 1
