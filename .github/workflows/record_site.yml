name: Record Site Cloud 60FPS

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to record'
        required: false
        default: 'https://dreamheights-source.vercel.app/'

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          pip install playwright
          playwright install chromium --with-deps

      - name: Run screen recording
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://dreamheights-source.vercel.app/' }}
        run: |
          python3 record_site_gha.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreamheights-recording-60fps
          path: /tmp/dreamheights_cloud_60fps.mp4
          retention-days: 7
