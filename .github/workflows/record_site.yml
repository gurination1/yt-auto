name: Record Site Cloud 60FPS

on:
  workflow_dispatch:
    inputs:
      target_site:
        description: 'Which site to record: both, dreamheights, or bioprac'
        required: false
        default: 'both'

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl xvfb libgl1-mesa-dri mesa-utils
          pip install playwright
          playwright install chromium --with-deps

      - name: Run 60FPS screen recording with Xvfb & X11grab
        env:
          TARGET_SITE: ${{ github.event.inputs.target_site || 'both' }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "4"
          GALLIUM_DRIVER: "llvmpipe"
        run: |
          # Start Xvfb virtual display with 24-bit 1920x1080 resolution and GLX support
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2
          python3 record_site_gha.py

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-recordings-60fps
          path: /tmp/*_cloud_60fps.mp4
          retention-days: 7
